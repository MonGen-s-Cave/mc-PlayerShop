hooks:
  currency:
    default: vault

    providers:
      vault:
        enabled: true
      coinsengine:
        enabled: true
      playerpoints:
        enabled: true

    currencies:
      vault:
        provider: vault
        display-name: '&aCoins'
        prefix: $
      points:
        provider: playerpoints
        display-name: '&bPoints'
        prefix: '🔥'
      gems:
        provider: coinsengine
        currency-id: gems
        display-name: '&bGems'
        prefix: ♦
      tokens:
        provider: coinsengine
        currency-id: tokens
        display-name: '&eTokens'
        prefix: ✦

version: '1'
