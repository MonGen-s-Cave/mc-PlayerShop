database:
  # H2, MySQL
  type: "h2"

  mysql:
    host: "localhost"
    port: 3306
    database: "database"
    username: "username"
    password: "password"

  pool:
    maximumPoolSize: 10
    minimumIdle: 5
    connectionTimeout: 30000
    maxLifetime: 1800000
    idleTimeout: 600000
    setLeakDetectionThreshold: 60000
    useSSL: false

shop:
  # Which block types can be turned into a player shop.
  # Any block material works, not just containers - the shop stock is stored
  # in the database, not inside the physical block.
  #
  # If the block has its own inventory (BARREL, CHEST, SHULKER_BOX, ...) it must
  # be empty at creation, otherwise the items inside would become inaccessible.
  # Barrels are automatically rotated to face up when used as a shop.
  blocks:
    - "BARREL"

storage:
  max-items: 1000

hologram:
  offset-y: 1.2

  item:
    offset-y: 1.05
    scale: 0.3

  text:
    shadow: true
    billboard: VERTICAL

    background:
      enabled: false
      color: "TRANSPARENT" # TRANSPARENT or HEX color

    lines:
      - '&7{owner}'
      - "&f{item}"
      - "{shop_mode} &8◆ &a{price}{currency_prefix}"

formatting:
  # CLOCK_DD_HH_MM_SS -> 01:12:30:45 (days:hours:minutes:seconds)
  # CLOCK_HH_MM_SS -> 36:30:45 (total hours:minutes:seconds)
  # CLOCK_MM_SS -> 2190:45 (total minutes:seconds)
  #
  # WORDS_FULL -> 1 day 12 hours 30 minutes 45 seconds
  # WORDS_COMPACT -> 1d 12h 30m 45s
  #
  # HOURS_ONLY -> 36h
  # MINUTES_ONLY -> 2190m
  # SECONDS_ONLY -> 131445s
  time-format: "WORDS_COMPACT"
  amount-format: "COMPACT"

update-checker:
  # Periodically checks SpigotMC for a new version (every 30 minutes) and
  # notifies the console + online admins with the 'playershop.update-notify' permission.
  enabled: true

version: '2'