prefix: "&#FF8A65[PlayerShop]"

messages:
  reload: "%prefix% &aReloaded!"
  update-available: "%prefix% &a  A new version is available! &7(&c{current} &7→ &a{new}&7)"
  no-permission: "%prefix% &cYou don't have permission!"
  player-required: "%prefix% &cOnly players can use this!"
  player-not-found: "%prefix% &cPlayer not found!"
  missing-argument: "%prefix% &cMissing argument!"

  shop:
    storage-not-empty: "%prefix% &cStorage must be empty to switch mode!"
    storage-not-empty-simple: "%prefix% &cStorage must be empty!"

    admin-deleted: "%prefix% &aYou deleted &e{owner}&a's shop!"

    transaction-success: "%prefix% &aYou {mode} &e{amount}x {item} &afor &e{price} &afrom &e{owner}"
    transaction-failed: "%prefix% &cTransaction failed!"

    owner-notify:
      buy: "&e{player} &abought &e{amount}x {item} &afor &e{price}{currency} &afrom your shop"
      sell: "&e{player} &csold &e{amount}x {item} &cfor &e{price}{currency} &cto your shop"

    errors:
      block-content-not-empty: "%prefix% &cBlock must be empty to create a shop!"
      double-chest: "%prefix% &cYou can't create a shop on a double chest!"
      not-enough-money: "%prefix% &cYou don't have enough money!"
      not-enough-items: "%prefix% &cYou don't have enough items!"
      inventory-full: "%prefix% &cYour inventory is full!"
      storage-full: "%prefix% &cShop storage is full!"
      owner-no-money: "%prefix% &cShop owner has no money!"
      shop-empty: "%prefix% &cShop is out of stock!"
      invalid-amount: "%prefix% &cInvalid amount!"

    currency-updated: "%prefix% &aCurrency updated to: &e{currency}"
    currency-no-permission: "%prefix% &cYou don't have permission to use &e{currency}&c!"

    limit-reached: "%prefix% &cYou have reached your shop limit! (&e{current}/{limit}&c)"

    mode:
      buy: "&#7CF6FFBuying"
      sell: "&#FF7C7CSelling"

    price:
      invalid-number: "%prefix% &cInvalid number!"
      negative: "%prefix% &cPrice must be greater than or equal to 0!"
      too-large: "%prefix% &cPrice is too large!"
      updated: "%prefix% &aPrice updated to: &e{price}"

  dialog:
    price:
      title: "&#B8FFF2Set Price"
      body:
        - "&#7A8592Enter price"
        - "&#7A8592Example: 10.5"
      input: "&#C7D0D9Price"

    confirm: "&#7CF6FFConfirm"
    confirm-lore: "&#C7D0D9Click to confirm"

    cancel: "&#7A8592Cancel"
    cancel-lore: "&#C7D0D9Close"

  time:
    day: "day"
    day-plural: "days"

    hour: "hour"
    hour-plural: "hours"

    minute: "minute"
    minute-plural: "minutes"

    second: "second"
    second-plural: "seconds"

    short:
      day: "d"
      hour: "h"
      minute: "m"
      second: "s"

version: '6'